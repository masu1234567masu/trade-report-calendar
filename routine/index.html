<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ルーティンチェックリスト</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ルーティン">
<meta name="theme-color" content="#0b0f14">

<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<header class="app-header">
  <div class="header-titles">
    <h1>ルーティンチェックリスト</h1>
    <button id="today-label-btn" class="today-label-btn" type="button">
      <span id="today-label" class="today-label"></span>
      <svg class="cal-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h18"></path></svg>
    </button>
  </div>
  <div id="progress-badge" class="progress-badge">0/0</div>
</header>

<main>
  <ul id="item-list" class="item-list"></ul>

  <div id="add-row" class="add-row">
    <button id="add-open-btn" class="add-open-btn" type="button">
      <span class="plus">＋</span> 項目を追加
    </button>
    <form id="add-form" class="add-form" hidden>
      <input type="text" id="add-input" placeholder="項目名を入力" autocomplete="off">
      <div class="add-form-actions">
        <button type="submit" class="btn btn-primary">追加</button>
        <button type="button" id="add-cancel-btn" class="btn btn-ghost">キャンセル</button>
      </div>
    </form>
  </div>

  <p id="empty-msg" class="empty-msg" hidden>項目がありません。「＋ 項目を追加」から追加してください。</p>
</main>

<div id="calendar-overlay" class="modal-overlay" hidden>
  <div class="modal calendar-modal">
    <div class="calendar-modal-header">
      <button id="cal-prev-btn" class="btn btn-ghost" type="button" aria-label="前の月">←</button>
      <span id="cal-month-label"></span>
      <button id="cal-next-btn" class="btn btn-ghost" type="button" aria-label="次の月">→</button>
    </div>
    <div class="calendar-weekdays">
      <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
    </div>
    <div id="calendar-days" class="calendar-days"></div>
    <div id="day-detail" class="day-detail" hidden></div>
    <button id="cal-close-btn" class="btn btn-ghost cal-close-btn" type="button">閉じる</button>
  </div>
</div>

<footer class="build-footer">routine build: 3</footer>

<script src="app.js?v=3"></script>
</body>
</html>
